name: AuroraCloud drift

# On demand only: runs the extended read-only live smoke (#49). Failures open
# or update one "AuroraCloud drift detected" issue. The contract check
# (src/auroraContract.ts against Ogard-Labs/auroradocs) runs by hand on a local
# checkout, `pnpm drift --auroradocs <checkout>`, so this repository holds no
# credential for the private auroradocs repository.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    environment: production-smoke
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the extended read-only live smoke
        id: smoke
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm auroracloud-live-smoke 2>&1 | tee smoke-report.txt
        env:
          AURORA_API_URL: ${{ secrets.AURORA_API_URL }}
          AURORA_WORKSPACE_ID: ${{ secrets.AURORA_WORKSPACE_ID }}
          AURORA_API_TOKEN: ${{ secrets.AURORA_API_TOKEN }}
          AURORA_SMOKE_WORKSPACE_ID: ${{ secrets.AURORA_SMOKE_WORKSPACE_ID }}
          AURORA_SMOKE_EXTENDED: '1'

      - name: Open or update the drift issue
        if: steps.smoke.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs')
            const read = (file) => fs.existsSync(file) ? fs.readFileSync(file, 'utf8').trim() : '(no output)'
            const title = 'AuroraCloud drift detected'
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            // This repository is public. Only the smoke's own one-line summary is
            // published (it never holds upstream messages or workspace records,
            // scripts/auroracloudLiveSmoke.test.mjs checks this), not the raw transcript.
            const smokeLines = read('smoke-report.txt').split('\n')
              .filter((line) => /^(AuroraCloud MCP live smoke|Live smoke tool|AURORA_[A-Z_]+ )/.test(line))
            const smoke = smokeLines.length ? smokeLines.slice(-5).join('\n') : '(no summary line; see the run log)'
            const body = [
              `The extended live smoke failed on ${new Date().toISOString().slice(0, 10)}. Run: ${run}`,
              '',
              `**Extended live smoke:** ${'${{ steps.smoke.outcome }}'}`,
              '```', smoke, '```',
            ].join('\n')
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 100 })
            const existing = open.find((issue) => issue.title === title && !issue.pull_request)
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body })
            } else {
              await github.rest.issues.create({ ...context.repo, title, body })
            }
            core.setFailed('AuroraCloud drift detected; see the issue.')
